<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DewTube</title>
<meta name="description" content="DewTube: a minimal, search-first way to find and watch movies and TV shows.">
<meta property="og:title" content="DewTube — Search and stream">
<meta property="og:description" content="A minimal, search-first way to find and watch movies and TV shows.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Roboto:wght@400;500&display=swap">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0a84ff">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<style>
  :root{
    --radius:.625rem;
    --background:oklch(13% .005 250);
    --foreground:oklch(98.4% .003 247.858);
    --card:oklch(20.8% .042 265.755);
    --muted:oklch(27.9% .041 260.031);
    --muted-foreground:oklch(70.4% .04 256.788);
    --border:oklch(100% 0 0/.1);
    --primary:oklch(65% .19 250);
  }
  *,*::before,*::after{box-sizing:border-box;border:0 solid var(--border);margin:0;padding:0}
  html{-webkit-text-size-adjust:100%;line-height:1.5;font-family:Manrope,sans-serif;-webkit-tap-highlight-color:transparent}
  body{background:var(--background);color:var(--foreground);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;min-height:100vh}
  img,svg,video,canvas,iframe{display:block;vertical-align:middle}
  img,video{max-width:100%;height:auto}
  button,input,select{font:inherit;color:inherit;background:transparent;border-radius:0}
  ::placeholder{color:color-mix(in oklab,currentColor 50%,transparent)}
  main{min-height:100vh;padding:0 1.25rem}
  #wrap{margin:0 auto;max-width:42rem;padding-top:30vh;transition:padding .5s cubic-bezier(.4,0,.2,1)}
  #wrap.active{padding-top:2.5rem}
  h1{font-family:Roboto,sans-serif;text-align:center;font-size:3rem;line-height:1;font-weight:400;letter-spacing:0}
  .dew{color:oklch(65% .19 250)}
  .tube{color:#fff}
  .search{position:relative;margin-top:2rem}
  .search .icon{position:absolute;left:1.25rem;top:50%;transform:translateY(-50%);width:1.25rem;height:1.25rem;color:var(--muted-foreground);pointer-events:none}
  #q{width:100%;border:1px solid var(--border);background:var(--card);border-radius:9999px;padding:1rem 1.25rem 1rem 3.5rem;font-size:1.125rem;line-height:1.75;color:inherit;outline:none;transition:border-color .15s cubic-bezier(.4,0,.2,1)}
  #q:focus{border-color:var(--primary)}
  #results{margin:2.5rem auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem;max-width:72rem;padding-bottom:4rem}
  @media(min-width:40rem){#results{grid-template-columns:repeat(3,minmax(0,1fr))}}
  @media(min-width:48rem){#results{grid-template-columns:repeat(4,minmax(0,1fr))}}
  @media(min-width:64rem){#results{grid-template-columns:repeat(6,minmax(0,1fr))}}
  .card{background:transparent;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit;display:block;width:100%}
  .card .poster{aspect-ratio:2/3;overflow:hidden;border-radius:var(--radius);background:var(--muted)}
  .card .poster img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s cubic-bezier(.4,0,.2,1);transform-origin:center}
  .card:hover .poster img{transform:scale(1.05)}
  .card .t{margin-top:.5rem;font-size:.875rem;line-height:1.25rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s cubic-bezier(.4,0,.2,1)}
  .card:hover .t{color:var(--primary)}
  .card .s{font-size:.75rem;line-height:1rem;color:var(--muted-foreground)}
  .msg{grid-column:1/-1;text-align:center;color:var(--muted-foreground)}
  .msg.small{font-size:.75rem;line-height:1rem;margin-top:.75rem}
  .overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:color-mix(in oklab,var(--background) 85%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding:clamp(.5rem,2vw,1rem);overflow:auto}
  .overlay .inner{width:100%;max-width:min(90rem,calc((100dvh - 5.5rem) * 16 / 9));margin:auto}
  @media(max-width:48rem){.overlay{align-items:flex-start}.overlay .inner{max-width:100%}}
  @media(max-aspect-ratio:16/9){.overlay .inner{max-width:100%}}
  .topBar{display:flex;justify-content:flex-end;align-items:center;gap:.5rem;margin-bottom:.5rem;min-height:38px;width:max-content;margin-left:auto}
  .topBar:empty{display:none}
  .playerWrap{position:relative}
  .frameBox{aspect-ratio:16/9;width:100%;max-height:calc(100dvh - 5.5rem);overflow:hidden;border-radius:calc(var(--radius) + 4px);border:1px solid var(--border);background:var(--muted)}
  .frameBox iframe{width:100%;height:100%;border:0;display:block}
  .field{display:flex;align-items:center;gap:.25rem;border:1px solid var(--border);background:var(--card);border-radius:calc(var(--radius) - 2px);font-size:.875rem;line-height:1.25rem;padding:.5rem 2px .5rem .75rem;outline:none;transition:border-color .15s cubic-bezier(.4,0,.2,1)}
  .field:focus-within{border-color:var(--primary)}
  .field input[type=number]{width:auto;background:none;border:0;outline:none;color:inherit;font:inherit;line-height:1.25rem;padding:0}
  .field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{opacity:1;height:auto;margin:0}
</style>
</head>
<body>
<main>
  <div id="wrap">
    <h1><span class="dew">Dew</span><span class="tube">Tube</span></h1>
    <div class="search">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
      <input id="q" autofocus autocomplete="off" placeholder="Search movies &amp; shows">
    </div>
  </div>
  <section id="results"></section>
</main>
<script>
/* ---------- Config & small utilities ---------- */

const TMDB_KEY = '8baba8ab6b8bbe247645bcae7df63d0d';
const TMDB = 'https://api.themoviedb.org/3';
const ANILIST = 'https://graphql.anilist.co';
const ANIME_EMBED = 'https://novuscloud.buzz/embed/ani';

const $ = sel => document.querySelector(sel);
const img = (path, size = 'w342') => path ? `https://image.tmdb.org/t/p/${size}${path}` : null;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- API clients ---------- */

async function tmdb(path, params = {}) {
  const qs = new URLSearchParams({ api_key: TMDB_KEY, ...params });
  const res = await fetch(`${TMDB}${path}?${qs}`);
  if (!res.ok) throw new Error(`TMDB request failed (${res.status})`);
  return res.json();
}

const searchTmdb = async query =>
  (await tmdb('/search/multi', { query, include_adult: 'false' }))
    .results.filter(x => x.media_type === 'movie' || x.media_type === 'tv');

async function searchAnilist(query) {
  const res = await fetch(ANILIST, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
    body: JSON.stringify({
      query: `query($s:String){Page(perPage:12){media(search:$s,type:ANIME,isAdult:false,sort:SEARCH_MATCH){
        id title{english romaji} coverImage{large} seasonYear format episodes
      }}}`,
      variables: { s: query }
    })
  });
  if (!res.ok) throw new Error(`AniList request failed (${res.status})`);
  return (await res.json()).data.Page.media;
}

/* ---------- Search UI ---------- */

const wrap = $('#wrap');
const input = $('#q');
const results = $('#results');
let searchTimer, searchToken = 0;

input.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => runSearch(input.value.trim()), 350);
});

async function runSearch(query) {
  const active = query.length > 1;
  wrap.classList.toggle('active', active);
  if (!active) { results.innerHTML = ''; return; }

  const token = ++searchToken;
  results.innerHTML = '<p class="msg">Searching…</p>';

  const [tmdbResult, anilistResult] = await Promise.allSettled([
    searchTmdb(query),
    searchAnilist(query)
  ]);
  if (token !== searchToken) return;

  const movies = tmdbResult.status === 'fulfilled' ? tmdbResult.value : [];
  const anime = anilistResult.status === 'fulfilled' ? anilistResult.value : [];
  if (tmdbResult.status === 'rejected') console.error('TMDB:', tmdbResult.reason);
  if (anilistResult.status === 'rejected') console.error('AniList:', anilistResult.reason);

  const cards = [
    ...anime.map(entry => makeCard({
      poster: entry.coverImage?.large,
      title: entry.title.english ?? entry.title.romaji,
      sub: `Anime · ${entry.seasonYear ?? ''}`,
      open: () => openPlayer({ type: 'anime', id: entry.id, format: entry.format, episodes: entry.episodes })
    })),
    ...movies.map(entry => makeCard({
      poster: img(entry.poster_path),
      title: entry.title ?? entry.name,
      sub: `${entry.media_type === 'tv' ? 'Series' : 'Movie'} · ${(entry.release_date ?? entry.first_air_date ?? '').slice(0, 4)}`,
      open: () => openPlayer({ type: entry.media_type, id: entry.id })
    }))
  ];

  results.innerHTML = '';
  cards.forEach(card => results.appendChild(card));

  if (!cards.length) {
    const failures = [tmdbResult, anilistResult].filter(r => r.status === 'rejected').length;
    results.insertAdjacentHTML('beforeend',
      `<p class="msg">${failures ? 'Could not load results — check the browser console for details.' : 'No results.'}</p>`);
    return;
  }
  if (tmdbResult.status === 'rejected')
    results.insertAdjacentHTML('beforeend', '<p class="msg small">Movie/TV results (TMDB) failed to load.</p>');
  if (anilistResult.status === 'rejected')
    results.insertAdjacentHTML('beforeend', '<p class="msg small">Anime results (AniList) failed to load.</p>');
}

function makeCard({ poster, title, sub, open }) {
  const button = document.createElement('button');
  button.className = 'card';
  button.innerHTML =
    `<div class="poster">${poster ? `<img src="${esc(poster)}" alt="" loading="lazy">` : ''}</div>` +
    `<p class="t">${esc(title)}</p>` +
    `<p class="s">${esc(sub)}</p>`;
  button.addEventListener('click', open);
  return button;
}

/* ---------- Reusable number field ---------- */

/**
 * Builds a `.field` with a label and an auto-sizing number input.
 * `wrapValue(raw)` normalizes the raw input value (may return null to reject).
 * `onCommit(value)` runs when the value is valid.
 */
function makeNumberField({ label, ariaLabel, initial, wrapValue, onCommit }) {
  const field = document.createElement('div');
  field.className = 'field';
  field.innerHTML = `<span>${label}</span><input aria-label="${ariaLabel}" type="number" step="1">`;

  const numberInput = field.querySelector('input');
  const resize = () => {
    numberInput.style.width = `calc(${String(numberInput.value || '').length}ch + 17px)`;
  };

  const commit = () => {
    const normalized = wrapValue(numberInput.value);
    if (normalized == null) { resize(); return; }
    numberInput.value = normalized;
    resize();
    onCommit(normalized);
  };

  numberInput.value = initial;
  resize();
  numberInput.addEventListener('input', commit);
  numberInput.addEventListener('change', commit);

  return { field, input: numberInput, resize };
}

/* ---------- Player ---------- */

const isTVFormat = format => format === 'TV' || format === 'TV_SHORT';

function videoUrl({ type, id, format, episode, audio, season }) {
  if (type === 'anime') {
    return `${ANIME_EMBED}/${id}/${isTVFormat(format) ? episode : 1}/${audio}`;
  }
  if (type === 'movie') {
    return `https://vidsrc.sh/embed/movie/${id}`;
  }
  return `https://vidsrc.sh/embed/tv/${id}/${season}/${episode}`;
}

/** Maps a global episode number onto TMDB season data. */
function makeEpisodeMapper(seasons) {
  return globalEp => {
    const g = Math.max(1, globalEp || 1);
    if (!seasons.length) return { season: 1, episode: g, global: g };

    let remaining = g;
    for (const season of seasons) {
      if (remaining <= season.count) return { season: season.n, episode: remaining, global: g };
      remaining -= season.count;
    }
    const last = seasons[seasons.length - 1];
    return { season: last.n, episode: last.count + remaining, global: g };
  };
}

async function openPlayer({ type, id, format = null, episodes = null }) {
  const state = { season: 1, episode: 1, audio: 'sub' };
  let seasons = [];

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML =
    `<div class="inner">` +
      `<div class="topBar" id="topBar"></div>` +
      `<div class="playerWrap"><div id="frameBox" class="frameBox"></div></div>` +
    `</div>`;
  document.body.appendChild(overlay);

  const frameBox = overlay.querySelector('#frameBox');
  const topBar = overlay.querySelector('#topBar');

  const close = () => {
    overlay.remove();
    window.removeEventListener('keydown', onKey);
  };
  const onKey = event => { if (event.key === 'Escape') close(); };

  window.addEventListener('keydown', onKey);
  overlay.addEventListener('click', close);
  frameBox.addEventListener('click', event => event.stopPropagation());
  topBar.addEventListener('click', event => event.stopPropagation());

  function loadFrame() {
    frameBox.innerHTML = '';
    const frame = document.createElement('iframe');
    frame.allowFullscreen = true;
    frame.allow = 'autoplay; fullscreen';
    frame.referrerPolicy = 'origin';
    frame.src = videoUrl({ type, id, format, ...state });
    frameBox.appendChild(frame);
  }

  /* --- Episode picker for TV, using TMDB season data --- */
  if (type === 'tv') {
    const mapGlobal = makeEpisodeMapper(seasons);
    const applyGlobal = raw => {
      if (raw === '' || isNaN(+raw) || +raw < 1) return;
      const mapped = mapGlobal(+raw);
      state.season = mapped.season;
      state.episode = mapped.episode;
      loadFrame();
    };

    const { field, input: episodeInput } = makeNumberField({
      label: 'Episode',
      ariaLabel: 'Episode',
      initial: 1,
      wrapValue: raw => raw,
      onCommit: applyGlobal
    });
    topBar.appendChild(field);

    try {
      const details = await tmdb(`/tv/${id}`);
      seasons = (details.seasons ?? [])
        .filter(s => s.season_number > 0 && s.episode_count > 0)
        .sort((a, b) => a.season_number - b.season_number)
        .map(s => ({ n: s.season_number, count: s.episode_count }));
    } catch (error) {
      console.error('[DewTube] TMDB /tv failed:', error);
      seasons = [];
    }
    if (episodeInput.value !== '' && +episodeInput.value >= 1) applyGlobal(episodeInput.value);
  }

  /* --- Audio + episode pickers for anime --- */
  if (type === 'anime') {
    const { field: audioField } = makeNumberField({
      label: 'Audio',
      ariaLabel: 'Audio',
      initial: 1,
      wrapValue: raw => {
        if (raw === '') return null;
        const n = parseInt(raw, 10);
        return isNaN(n) ? 1 : ((n - 1) % 2 + 2) % 2 + 1;
      },
      onCommit: value => {
        state.audio = value === 2 ? 'dub' : 'sub';
        loadFrame();
      }
    });
    topBar.appendChild(audioField);

    if (episodes !== 1) {
      const { field: episodeField } = makeNumberField({
        label: 'Episode',
        ariaLabel: 'Episode',
        initial: 1,
        wrapValue: raw => raw,
        onCommit: value => {
          state.episode = +value;
          loadFrame();
        }
      });
      topBar.appendChild(episodeField);
    }
  }

  loadFrame();
}
</script>
</body>
</html>
